# Conda environment matching the one the published results were produced with
# (originally "dnabert2": Python 3.8, PyTorch 1.13 / CUDA 11.7).
#   conda env create -f environment.yml && conda activate triplevar && pip install -e ".[embeddings,dev]"
name: triplevar
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pytorch=1.13.1
  - pytorch-cuda=11.7
  - pip:
      - numpy==1.24.4
      - pandas==2.0.3
      - scikit-learn==1.2.2
      - matplotlib==3.7.5
      - seaborn==0.13.2
      - pyyaml==6.0.2
      - tqdm
      - transformers==4.29.2
      - einops==0.6.1
      - fair-esm==2.0.0
      - pytest
