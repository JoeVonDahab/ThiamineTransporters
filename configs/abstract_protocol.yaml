# The protocol behind the ASCPT 2026 abstract model, re-run with fixed seeds:
# row-level seed-42 split, published hyperparameters, early stopping on
# val accuracy + 0.1 x pathogenic recall.
name: abstract_protocol
split: published
seeds: [1, 2, 3, 4, 5]
layout: {use_dna: true, use_protein: true, use_tabular: true}
train:
  hidden_dims: [2048, 1024, 512, 256]
  activation: LeakyReLU
  dropout: 0.2
  optimizer: RMSprop
  lr: 0.0005
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 300
  early_stopping_patience: 100
  lr_patience: 25
  lr_factor: 0.2
  class_balance_beta: 0.999
  selection_metric: legacy
